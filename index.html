<!DOCTYPE html>
<html lang="ko" data-text="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<title>여행 일정</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#eceef2;color:#16181d;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none !important}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:#f6f7f9;padding-bottom:34px;
  --fs:14.5px;--sm:12.5px;--xs:11px;--pad:16px;--line:#e7eaef;--muted:#6d7686}
html[data-text="large"] .app{--fs:17px;--sm:15px;--xs:13px}

/* ───── header ───── */
.top{position:sticky;top:0;z-index:30;background:rgba(246,247,249,.94);
  -webkit-backdrop-filter:saturate(160%) blur(10px);backdrop-filter:saturate(160%) blur(10px);
  border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:flex-start;gap:8px;padding:13px var(--pad) 9px}
.hd .tt{flex:1;min-width:0}
.hd h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.hd .sb{margin-top:2px;font-size:var(--xs);font-weight:600;color:#7d8696}
.lgbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;height:30px;min-width:34px;
  padding:0 7px;font-size:12px;font-weight:800;color:#4a5261;cursor:pointer;line-height:1}
.lgbtn[aria-pressed="true"]{background:#16181d;border-color:#16181d;color:#fff}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:0 var(--pad) 9px}
.tab{border:1px solid transparent;background:transparent;border-radius:9px;padding:5px 0 6px;
  font-size:var(--sm);font-weight:700;color:#5c6573;cursor:pointer;min-width:0;overflow:hidden;
  letter-spacing:-.04em;white-space:nowrap}
.tab i{display:block;font-style:normal;font-size:10px;color:#9ba2b0;font-weight:600;margin-top:1px;white-space:nowrap;letter-spacing:-.02em}
.tab.food{color:#8a4a12}
.tab.food i{color:#c08a53}
.tab.food.on{background:#8a4a12;color:#fff}
.tab.food.on i{color:#f0d3b8}
.tab.on{background:#16181d;color:#fff}
.tab.on i{color:#b7bdc8}
.tab.dec{color:#8a5f14}
.tab.dec.on{background:#8a5f14;color:#fff}
.tab.dec.on i{color:#f0dcb8}

/* ───── day head ───── */
main{padding:6px 0 0}
.dh{padding:12px var(--pad) 4px}
.dh h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:baseline;gap:7px}
.dh h2 span{font-size:var(--sm);font-weight:700;color:#8a92a1;letter-spacing:0}
.dh p{margin:3px 0 0;font-size:var(--sm);color:#5d6573;font-weight:600;word-break:keep-all}

/* ───── timeline ───── */
.tl{list-style:none;margin:0;padding:6px var(--pad) 0;position:relative}
.tl::before{content:"";position:absolute;left:calc(var(--pad) + 58px);top:14px;bottom:20px;width:1px;background:#dfe3ea}
.node{display:grid;grid-template-columns:50px 16px minmax(0,1fr);gap:0;padding:5px 0}
.node .rail{padding-top:12px;text-align:right;padding-right:4px}
.node .time{display:block;font-size:var(--sm);font-weight:800;color:#333a46;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.node .dur{display:block;font-size:10px;font-weight:700;color:#a6adba;margin-top:1px}
.node .dot{width:9px;height:9px;border-radius:50%;background:#c7ccd6;margin:16px auto 0;position:relative;z-index:1}
.node.st-confirmed .dot{background:#2340c8}
.node.st-candidate .dot{background:#e0a300}
.node.st-planB .dot{background:#98a0ae}
.node.st-walk_in .dot{background:#0e9f6e}
.node.st-optional .dot{background:#c7ccd6}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.card:active{border-color:#cfd5e0}
.card .ttl{display:flex;align-items:flex-start;gap:7px}
.card .nm{flex:1;min-width:0;font-size:var(--fs);font-weight:700;letter-spacing:-.02em;line-height:1.35;word-break:keep-all}
.node.st-optional .card .nm{color:#5f6774;font-weight:600}
.bd{flex:none;font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;letter-spacing:-.02em;
  border:1px solid transparent;white-space:nowrap;margin-top:2px}
.b-cand{background:#fff6dd;border-color:#f4e2ae;color:#8a5a00}
.b-plan{background:#f2f3f6;border-color:#e3e6ec;color:#5c6577}
.b-opt{background:#f4f5f8;border-color:#e7e9ef;color:#737b89}
.b-walk{background:#e9f7f0;border-color:#cbebdc;color:#0b7a52}
.b-warn{background:#ffefe9;border-color:#ffd8cb;color:#b42318}
.card .br{margin:3px 0 0;font-size:var(--sm);color:#6d7686;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.card .mt{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:6px;font-size:var(--xs);font-weight:600;color:#8b93a2}
.card .mt .ref{color:#5b45c0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}

/* ───── comparison ───── */
.cmp{margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.cmp>summary{list-style:none;display:flex;align-items:center;gap:7px;padding:8px 11px;cursor:pointer;
  font-size:var(--xs);font-weight:700;color:#5d6573}
.cmp>summary::-webkit-details-marker{display:none}
.cmp .cx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .cv{flex:none;color:#aeb5c1;font-size:12px;font-weight:700;transition:transform .2s}
.cmp[open] .cv{transform:rotate(90deg)}
.cbody{padding:0 11px 9px}
.cbody .ch{margin:0 0 4px;font-size:var(--xs);color:#8a7a52;line-height:1.45}
.opt{padding:8px 0;border-top:1px solid #f0f2f6}
.oh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.oh b{font-size:var(--sm);font-weight:800;letter-spacing:-.02em;color:#333a46;word-break:keep-all}
.oh i{font-style:normal;font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 5px;
  background:#eef1fb;color:#2c49c4;letter-spacing:-.01em}
.opt:not(.pick) .oh i{background:#f2f3f6;color:#6d7686}
.om{margin-top:1px;font-size:var(--xs);color:#7d8696;line-height:1.45;word-break:keep-all}
.op,.oc{margin-top:2px;font-size:var(--xs);line-height:1.45;color:#3f7a5c;word-break:keep-all}
.oc{color:#8c6a5c}
.ck{list-style:none;margin:6px 0 0;padding:6px 0 0;border-top:1px solid #f0f2f6}
.ck li{font-size:var(--xs);color:#6d7686;line-height:1.5;margin:1px 0;word-break:keep-all}
.cn,.cq{margin:6px 0 0;font-size:var(--xs);color:#7d8696;line-height:1.5;word-break:keep-all}
.cq{color:#8a7a52}

/* ───── decide rows ───── */
.page{padding-bottom:10px}
.ph{display:flex;align-items:baseline;gap:6px;margin:16px var(--pad) 6px;font-size:var(--sm);
  font-weight:800;letter-spacing:-.01em;color:#333a46}
.ph:first-child{margin-top:10px}
.ph em{font-style:normal;font-size:var(--xs);font-weight:700;color:#9ba2b0}
.list{list-style:none;margin:0;padding:0 var(--pad);display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:9px 11px;cursor:pointer}
.row .rd{flex:none;font-size:var(--xs);font-weight:800;color:#8b93a2;min-width:24px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:var(--sm);font-weight:800;letter-spacing:-.02em;line-height:1.35;word-break:keep-all}
.row .rt i{display:block;font-style:normal;font-size:var(--xs);color:#8b93a2;margin-top:1px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ra{flex:none;color:#c4c9d3;font-size:14px;font-weight:700}
.chk{list-style:none;margin:0;padding:0 var(--pad);display:flex;flex-direction:column;gap:4px}
.chk li{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
  font-size:var(--xs);line-height:1.5;color:#4d5563}
.chk .w{flex:none;font-size:10px;font-weight:800;color:#5c6573;background:#f2f4f8;border-radius:5px;
  padding:1px 5px;height:fit-content;margin-top:1px;min-width:34px;text-align:center}
.chk .w.urgent{background:#ffefe9;color:#b42318}
.bks{list-style:none;margin:0;padding:0 var(--pad);display:flex;flex-direction:column;gap:4px}
.bks li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;display:flex;gap:8px;align-items:baseline}
.bks .bi{flex:none;font-size:13px}
.bks .bt{flex:1;min-width:0}
.bks .bt b{font-size:var(--sm);font-weight:700;letter-spacing:-.01em;word-break:keep-all}
.bks .rf{display:inline-block;margin-left:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:var(--xs);font-weight:800;color:#5b45c0;background:#f4f2ff;border-radius:4px;padding:0 4px}
.bks .bt span{display:block;font-size:var(--xs);color:#8b93a2;margin-top:1px;line-height:1.45}
details.sec{margin:5px var(--pad) 0;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
details.sec>summary{list-style:none;padding:9px 11px;font-size:var(--sm);font-weight:800;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;letter-spacing:-.01em}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"⌄";color:#b6bdc9;font-weight:700}
details.sec[open]>summary::after{content:"⌃"}
details.sec .in{padding:0 11px 9px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:var(--xs);padding:4px 0;
  border-top:1px solid #f1f3f7;color:#4d5563}
.kv:first-child{border-top:0}
.kv b{font-weight:800;color:#232a36;text-align:right;font-variant-numeric:tabular-nums}
.kv .lft{text-align:left;font-weight:600;color:#4d5563}
.note{margin:4px 0 0;font-size:var(--xs);color:#7d8696;line-height:1.5;word-break:keep-all}
.empty{padding:16px var(--pad);font-size:var(--sm);color:#9ba2b0;text-align:center}

/* ───── food list ───── */
.fsum{display:flex;flex-wrap:wrap;gap:5px;margin:6px var(--pad) 0}
.fsum span{font-size:var(--xs);font-weight:700;color:#6d7686;background:#fff;border:1px solid var(--line);
  border-radius:99px;padding:2px 8px;white-space:nowrap}
.fgrp{margin:6px var(--pad) 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fgrp>summary{list-style:none;display:flex;align-items:center;gap:7px;padding:11px 12px;cursor:pointer}
.fgrp>summary::-webkit-details-marker{display:none}
.fgrp[open]>summary{border-bottom:1px solid #f1f3f7}
.fgrp .ic{flex:none;font-size:15px;line-height:1}
.fgrp .gt{flex:1;min-width:0;font-size:var(--fs);font-weight:800;letter-spacing:-.02em;word-break:keep-all}
.fgrp .gn{flex:none;font-size:10px;font-weight:800;color:#5c6573;background:#f2f4f8;border-radius:99px;
  padding:1px 7px;font-variant-numeric:tabular-nums}
.fgrp .gv{flex:none;color:#b6bdc9;font-size:12px;font-weight:700;transition:transform .2s}
.fgrp[open] .gv{transform:rotate(180deg)}
.fbody{padding:8px 9px 9px;display:flex;flex-direction:column;gap:6px}
.fc{background:#fbfbfd;border:1px solid #eef0f5;border-radius:10px;padding:9px 10px}
.fc .fd{margin:0;font-size:var(--fs);font-weight:800;letter-spacing:-.02em;line-height:1.35;word-break:keep-all;color:#16181d}
.fc .fsub{font-weight:600;color:#5d6573;font-size:var(--sm);letter-spacing:-.01em}
.fm{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.fm .fa{font-size:10px;font-weight:800;color:#5c6573;background:#eef1f6;border-radius:5px;padding:1px 6px;letter-spacing:-.01em}
.fm .ft{font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px;border:1px solid transparent;letter-spacing:-.01em}
.ft.t-conf{background:#e8edff;border-color:#cfd9fb;color:#2340c8}
.ft.t-cand{background:#fff6dd;border-color:#f4e2ae;color:#8a5a00}
.ft.t-plan{background:#f2f3f6;border-color:#e3e6ec;color:#5c6577}
.ft.t-out{background:#f7f8fa;border-color:#eceef3;color:#8b93a2}
.fc .fp{margin:4px 0 0;font-size:var(--xs);font-weight:800;color:#3a424f;font-variant-numeric:tabular-nums}
.fc .fn{margin:2px 0 0;font-size:var(--xs);color:#6d7686;line-height:1.45;word-break:keep-all}
.ff{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid #eef0f5}
.ff .fnm{flex:1;min-width:0;font-size:10.5px;font-weight:600;color:#98a0ae;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff .fmap{flex:none;font-size:10.5px;font-weight:800;color:#2340c8;text-decoration:none;
  background:#f3f6ff;border:1px solid #dfe6fa;border-radius:6px;padding:2px 7px;white-space:nowrap}

/* ───── sheet ───── */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.on{display:block}
.backdrop{position:absolute;inset:0;background:rgba(14,19,32,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#f6f7f9;
  border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateY(8px);opacity:0;transition:transform .2s ease,opacity .2s ease}
.sheet-wrap.on .sheet{transform:none;opacity:1}
.sheet .grab{position:sticky;top:0;background:#f6f7f9;padding:8px 0 2px;display:flex;justify-content:center;z-index:2}
.sheet .grab i{width:34px;height:4px;border-radius:99px;background:#dde1e8;display:block}
.sbody{padding:0 16px}
.sh-head{display:flex;gap:9px;align-items:flex-start}
.sh-head .st{font-size:var(--xs);font-weight:800;color:#8b93a2}
.sh-head h3{margin:1px 0 0;font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.3;word-break:keep-all}
.sh-head .ja{font-size:var(--xs);color:#9ba2b0;margin-top:2px}
.x2{flex:none;margin-left:auto;border:0;background:#e9ecf1;border-radius:50%;width:28px;height:28px;
  font-size:12px;font-weight:800;color:#5c6573;cursor:pointer}
.bkbox{margin-top:10px;background:#f4f6ff;border:1px solid #dde3fa;border-radius:11px;padding:9px 11px}
.bkbox .bk-h{font-size:10px;font-weight:800;color:#3b46c4;letter-spacing:.03em}
.bkbox .bk-r{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:800;
  color:#232a36;margin-top:2px;word-break:break-all}
.bkbox .bk-n{font-size:var(--xs);color:#5d6573;margin-top:3px;line-height:1.5;word-break:keep-all}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0 0;font-size:var(--xs);color:#4d5563}
.facts dt{color:#98a0ae;font-weight:700;white-space:nowrap}
.facts dd{margin:0;line-height:1.5;word-break:keep-all}
.facts a{color:#2340c8;font-weight:700;text-decoration:none}
.cnote{margin:10px 0 0;font-size:var(--sm);color:#4d5563;line-height:1.55;word-break:keep-all}
.cnotes{margin:6px 0 0;padding-left:15px;font-size:var(--sm);color:#5d6573;line-height:1.55;word-break:keep-all}
.cnotes li{margin:2px 0}
.warn{display:flex;gap:6px;margin-top:9px;background:#fff5f1;border:1px solid #ffdccf;border-radius:9px;
  padding:7px 9px;font-size:var(--xs);color:#9c2a17;line-height:1.5;font-weight:600;word-break:keep-all}
.sacts{display:flex;gap:6px;margin-top:14px}
.sacts a{flex:1;display:flex;align-items:center;justify-content:center;border:1px solid #dfe3ec;background:#fff;
  border-radius:10px;padding:9px 0;font-size:var(--xs);font-weight:800;text-decoration:none;color:#38404e}
.sacts a:first-child{color:#2340c8;border-color:#d8e0f8;background:#f6f8ff}
.sheet .cmp{margin-top:12px;background:#fff}
.sheet .sec{margin-left:0;margin-right:0}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:90;background:#16181d;color:#fff;
  font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:10px;opacity:0;pointer-events:none;
  transition:.22s;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{padding:22px var(--pad) 6px;font-size:10px;color:#a7aeb9;line-height:1.6;text-align:center}

/* ───── lock ───── */
.lock{position:fixed;inset:0;z-index:99;background:#f6f7f9;display:flex;align-items:center;justify-content:center;
  padding:24px}
.lbox{width:100%;max-width:320px;text-align:center}
.lock-ico{font-size:22px}
.lock h1{margin:10px 0 0;font-size:19px;font-weight:800;letter-spacing:-.03em}
.lock-sub{margin:4px 0 0;font-size:12.5px;font-weight:600;color:#8b93a2}
.dots{display:flex;justify-content:center;gap:13px;margin:26px 0 0}
.dots i{width:11px;height:11px;border-radius:50%;background:#fff;border:1.5px solid #ccd2dc;transition:.15s}
.dots i.on{background:#16181d;border-color:#16181d}
.lock-msg{min-height:19px;margin:14px 0 10px;font-size:12.5px;font-weight:700;color:#b42318}
.lock-msg.info{color:#8b93a2}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:236px;margin:0 auto}
.pad button{border:1px solid #e3e6ec;background:#fff;border-radius:50%;width:100%;max-width:68px;aspect-ratio:1/1;
  justify-self:center;font-size:21px;font-weight:600;color:#232a36;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pad button:active{background:#eef0f4}
.pad button[data-k="del"]{background:transparent;border-color:transparent;color:#8b93a2;font-size:16px}
.pad button.blank{background:transparent;border-color:transparent;pointer-events:none}
.lock-foot{margin:22px 0 0;font-size:10.5px;color:#a7aeb9;line-height:1.6}
.shake{animation:sh .3s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ───── eSIM 카드 (1일차) ───── */
.esim{margin:9px var(--pad) 2px;background:#0f172a;border-radius:14px;padding:11px 12px 10px;color:#fff}
.esim .eh{display:flex;align-items:center;gap:6px;font-size:var(--fs);font-weight:800;letter-spacing:-.02em;word-break:keep-all}
.esim .eh .ei{flex:none}
.esim .eh .eb{margin-left:auto;flex:none;font-size:9.5px;font-weight:800;background:#1f9d55;border-radius:5px;padding:1px 6px;white-space:nowrap}
.esim .es{margin:3px 0 0;font-size:var(--xs);color:#b9c2d0;line-height:1.5;word-break:keep-all}
.esim details.ep{border-top:1px solid rgba(255,255,255,.13);margin-top:8px;padding-top:5px}
.esim details.ep>summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 0;-webkit-tap-highlight-color:transparent}
.esim details.ep>summary::-webkit-details-marker{display:none}
.esim details.ep>summary .pn{font-size:var(--fs);font-weight:800;letter-spacing:-.02em}
.esim details.ep>summary .dev{font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;background:#1c2a44;color:#c2cddd;white-space:nowrap}
.esim details.ep>summary .cv{margin-left:auto;flex:none;color:#7f8ba0;font-size:12px;font-weight:700;transition:transform .2s}
.esim details.ep[open]>summary .cv{transform:rotate(90deg)}
.esim .epb{padding:2px 0 2px}

const K256 = new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(m){
  const l=m.length, total=Math.ceil((l+9)/64)*64;
  const u=new Uint8Array(total); u.set(m); u[l]=0x80;
  const dv=new DataView(u.buffer);
  dv.setUint32(total-8, Math.floor(l/536870912), false);
  dv.setUint32(total-4, (l*8)>>>0, false);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const W=new Uint32Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++) W[t]=dv.getUint32(i+t*4,false);
    for(let t=16;t<64;t++){
      const x=W[t-15], y=W[t-2];
      const s0=(((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))>>>0;
      const s1=(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10))>>>0;
      W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))>>>0;
      const ch=((e&f)^((~e)&g))>>>0;
      const t1=(h+S1+ch+K256[t]+W[t])>>>0;
      const S0=(((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))>>>0;
      const mj=((a&b)^(a&c)^(b&c))>>>0;
      const t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const out=new Uint8Array(32), od=new DataView(out.buffer);
  for(let i=0;i<8;i++) od.setUint32(i*4, H[i], false);
  return out;
}
function cat(a,b){
  const o=new Uint8Array(a.length+b.length); o.set(a,0); o.set(b,a.length); return o;
}
function hmac(k,m){
  const kb=k.length>64?sha256(k):k;
  const ip=new Uint8Array(64), op=new Uint8Array(64);
  for(let i=0;i<64;i++){ const v=i<kb.length?kb[i]:0; ip[i]=v^0x36; op[i]=v^0x5c; }
  return sha256(cat(op, sha256(cat(ip, m))));
}
function pbkdf2(pw, salt, iters, len){
  const p=new TextEncoder().encode(pw);
  const out=new Uint8Array(len); let pos=0, blk=1;
  while(pos<len){
    const bi=new Uint8Array([(blk>>>24)&255,(blk>>>16)&255,(blk>>>8)&255,blk&255]);
    let u=hmac(p, cat(salt, bi));
    const t=u.slice(0);
    for(let i=1;i<iters;i++){ u=hmac(p,u); for(let j=0;j<32;j++) t[j]^=u[j]; }
    out.set(t.subarray(0, Math.min(32, len-pos)), pos); pos+=32; blk++;
  }
  return out;
}
function stream(key, nonce, len){
  const out=new Uint8Array(len); let pos=0, c=0;
  while(pos<len){
    const ci=new Uint8Array([(c>>>24)&255,(c>>>16)&255,(c>>>8)&255,c&255]);
    const b=hmac(key, cat(nonce, ci));
    out.set(b.subarray(0, Math.min(32, len-pos)), pos); pos+=32; c++;
  }
  return out;
}
function b64d(s){
  const bin=atob(s), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function b64e(u){
  let s=''; for(let i=0;i<u.length;i+=4096) s+=String.fromCharCode.apply(null, u.subarray(i, i+4096));
  return btoa(s);
}
function same(a,b){
  if(!a||!b||a.length!==b.length) return false;
  let d=0; for(let i=0;i<a.length;i++) d|=a[i]^b[i];
  return d===0;
}
async function derive(pin){
  const salt=b64d(PAYLOAD.salt);
  let dk=null;
  try{
    if(self.crypto && self.crypto.subtle){
      const base=await self.crypto.subtle.importKey('raw', new TextEncoder().encode(pin), {name:'PBKDF2'}, false, ['deriveBits']);
      const bits=await self.crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:PAYLOAD.iter, hash:'SHA-256'}, base, 512);
      dk=new Uint8Array(bits);
    }
  }catch(e){ dk=null; }
  if(!dk) dk=pbkdf2(pin, salt, PAYLOAD.iter, 64);
  return {enc:dk.subarray(0,32), mac:dk.subarray(32,64)};
}
function decryptWith(k){
  const nonce=b64d(PAYLOAD.nonce), ct=b64d(PAYLOAD.ct);
  if(!same(hmac(k.mac, cat(nonce, ct)), b64d(PAYLOAD.mac))) return null;
  const ks=stream(k.enc, nonce, ct.length);
  const pt=new Uint8Array(ct.length);
  for(let i=0;i<ct.length;i++) pt[i]=ct[i]^ks[i];
  try{ return JSON.parse(new TextDecoder().decode(pt)); }catch(e){ return null; }
}

/* ══════════════ 잠금 화면 ══════════════ */
const $ = s => document.querySelector(s);
let KEYB=null, payloadData=null, pin='', busy=false;

function dots(){ const d=$('#dots'); if(!d) return; [].forEach.call(d.children,(el,i)=>el.classList.toggle('on', i<pin.length)); }
function lockMsg(t,soft){ const m=$('#lockMsg'); m.textContent=t||''; m.className='lock-msg'+(soft?' info':''); }
function shake(){ const b=$('#lbox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }

function reveal(data){
  payloadData=data;
  $('#lock').hidden=true; $('#lock').style.display='none';
  const app=$('#app'); app.hidden=false;
  init();
}

async function tryPin(){
  if(busy) return;
  busy=true; lockMsg('확인 중…', true);
  const k=await derive(pin);
  const data=decryptWith(k);
  if(!data){
    busy=false; pin=''; dots(); lockMsg('코드가 맞지 않아요. 다시 입력해 주세요.'); shake();
    return;
  }
  try{ sessionStorage.setItem('tkv2', b64e(cat(k.enc, k.mac))); }catch(e){}
  KEYB=k; busy=false; lockMsg('');
  reveal(data);
}

function padPress(k){
  if(busy) return;
  if(k==='del'){ pin=pin.slice(0,-1); dots(); if($('#lockMsg').textContent) lockMsg(''); return; }
  if(pin.length>=4) return;
  pin+=k; dots();
  if($('#lockMsg').textContent) lockMsg('');
  if(pin.length===4) tryPin();
}

$('#pad').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b || !b.dataset.k) return;
  padPress(b.dataset.k);
});
document.addEventListener('keydown', e=>{
  if(!$('#lock').hidden){
    if(/^[0-9]$/.test(e.key)) padPress(e.key);
    else if(e.key==='Backspace') padPress('del');
    return;
  }
  if(e.key==='Escape') closeSheet();
});

let DATA=null, DAYS=[], DEC={}, WARN=[], FOODS=[], FOODGROUPS=[];
const CAT={airport:'✈️',transit:'🚃',hotel:'🏨',meal:'🍽️',cafe:'☕',shop:'🛍',sight:'✨',clinic:'🩺',pickup:'👶',rest:'😴'};
const LEG={walk:'🚶',taxi:'🚕',train:'🚃',bus:'🚌',flight:'✈️'};
const LEGN={walk:'도보',taxi:'택시',train:'전철',bus:'버스',flight:'비행'};
const BD={candidate:['미정','b-cand'],planB:['대체','b-plan'],optional:['선택','b-opt'],walk_in:['현장','b-walk']};

const state={tab:null, large:false, openDecs:new Set(), fgroups:new Set()};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥'+Number(n).toLocaleString('ko-KR');
const won = n => '₩'+Number(n).toLocaleString('ko-KR');

function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'), 2200);
}
async function copyText(txt, btn){
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=txt; ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
      ok=document.execCommand('copy'); ta.remove();
    }catch(e2){ ok=false; }
  }
  if(ok){
    toast('복사했어요 — 붙여넣기 하세요');
    if(btn){ const o=btn.textContent; btn.textContent='복사됨'; setTimeout(()=>{btn.textContent=o;},1500); }
  } else {
    toast('복사가 안 되면 길게 눌러 직접 선택해 주세요');
  }
}
function byDay(id){ return DAYS.find(d=>d.id===id); }
function findSpot(id){
  for(const d of DAYS){ const s=d.spots.find(x=>x.id===id); if(s) return {day:d, spot:s}; }
  return null;
}
function durMin(a,b){
  if(!a||!b) return 0;
  const p=t=>{ const x=String(t).split(':'); return (+x[0])*60+(+x[1]||0); };
  return Math.max(0, p(b)-p(a));
}
function durText(m){
  if(!m) return '';
  if(m<60) return m+'분';
  const h=Math.floor(m/60), r=m%60; return r? h+'시간 '+r+'분' : h+'시간';
}
function mapsOf(o){
  if(o.mapsUrl) return o.mapsUrl;
  if(o.lat&&o.lng) return 'https://www.google.com/maps/search/?api=1&query='+o.lat+'%2C'+o.lng;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((o.nameJa||'')+' '+(o.name||''));
}
function dirOf(o,mode){
  if(o.lat&&o.lng) return 'https://www.google.com/maps/dir/?api=1&destination='+o.lat+'%2C'+o.lng+'&travelmode='+(mode||'walking');
  return mapsOf(o);
}
function warnFor(id){ return WARN.filter(w=>w.spotId===id); }
function legText(leg){
  if(!leg) return '';
  const bits=[LEGN[leg.mode]||''];
  if(leg.minutes) bits.push(leg.minutes+'분');
  if(leg.distanceKm) bits.push(leg.distanceKm+'km');
  return (LEG[leg.mode]||'')+' '+bits.join(' ');
}

/* ── header / tabs ── */
function tabsHTML(){
  return DAYS.map(d=>{
    const on=state.tab===d.id?' on':'';
    return '<button class="tab'+on+'" data-act="tab" data-tab="'+d.id+'" aria-label="'+d.index+'일차 '+d.weekday+'요일"><b style="font-weight:800">'+d.index+'일</b><i>'+d.date.slice(5).replace('-','/')+'</i></button>';
  }).join('') + '<button class="tab food'+(state.tab==='food'?' on':'')+'" data-act="tab" data-tab="food" aria-label="맛집 리스트"><b style="font-weight:800">맛집</b><i>'+(FOODS.length||'')+'곳</i></button>';
}
function applyLarge(){
  document.documentElement.dataset.text = state.large?'large':'normal';
  $('#lgbtn').setAttribute('aria-pressed', state.large?'true':'false');
}

/* ── cards ── */
function badgeHTML(st){
  const b=BD[st]; if(!b) return '';
  return '<span class="bd '+b[1]+'">'+b[0]+'</span>';
}
function decFold(d, compact){
  if(!d) return '';
  const opts=(d.options||[]).map(o=>{
    const one=(o.pros&&o.pros[0])?'<div class="op">+ '+esc(o.pros[0])+'</div>':'';
    const two=(o.cons&&o.cons[0])?'<div class="oc">− '+esc(o.cons[0])+'</div>':'';
    const meta=[o.price,o.meta].filter(Boolean).map(x=>esc(x)).join(' · ');
    return '<div class="opt'+(o.pick?' pick':'')+'">'+
      '<div class="oh"><b>'+esc(o.name)+'</b>'+(o.tag?'<i>'+esc(o.tag)+'</i>':'')+'</div>'+
      (meta?'<div class="om">'+meta+'</div>':'')+one+two+'</div>';
  }).join('');
  const checks=(d.checks||[]).length
    ? '<ul class="ck">'+d.checks.map(c=>'<li>'+(c.state==='done'?'☑':'☐')+' '+esc(c.label)+(c.text?' — '+esc(c.text):'')+'</li>').join('')+'</ul>'
    : '';
  return '<details class="cmp"'+(compact?'':' open')+'>'+
    '<summary><span>'+(d.done?'✅':'⚖️')+'</span><span class="cx">'+esc(d.title)+'</span><span class="cv">›</span></summary>'+
    '<div class="cbody">'+
      (d.hint?'<p class="ch">'+esc(d.hint)+'</p>':'')+
      opts+checks+
      (!compact&&d.question?'<p class="cq">'+esc(d.question)+'</p>':'')+
      (!compact&&d.note?'<p class="cn">'+esc(d.note)+'</p>':'')+
    '</div></details>';
}
function nodeHTML(day,s){
  const st=s.status||'candidate';
  const dec=s.dec&&DEC[s.dec];
  const dur=durText(durMin(s.timeStart,s.timeEnd));
  const meta=[];
  if(s.leg) meta.push(legText(s.leg));
  if(s.booking&&s.booking.ref) meta.push('<span class="ref">🎫 '+esc(s.booking.ref)+'</span>');
  const cost=s.cost? (s.cost.currency==='JPY'?yen(s.cost.amount):won(s.cost.amount)) : '';
  if(cost) meta.push(cost);
  const brief=s.note||(s.notes&&s.notes[0])||'';
  let h='<li class="node st-'+st+'" id="n-'+s.id+'">';
  h+='<div class="rail"><span class="time">'+esc(s.timeStart||'—')+'</span>'+(dur?'<span class="dur">'+dur+'</span>':'')+'</div>';
  h+='<span class="dot" aria-hidden="true"></span>';
  h+='<div>';
  h+='<div class="card" data-act="open" data-spot="'+s.id+'" role="button" tabindex="0">';
  h+='<div class="ttl"><span class="nm">'+esc(s.name)+'</span>'+(st==='confirmed'?'':badgeHTML(st))+'</div>';
  if(brief) h+='<p class="br">'+esc(brief)+'</p>';
  if(meta.length) h+='<div class="mt">'+meta.join('')+'</div>';
  h+='</div>';
  if(dec) h+=decFold(dec,true);
  h+='</div></li>';
  return h;
}
function dayHTML(d){
  if(!d) return '<div class="empty">일정을 찾을 수 없어요</div>';
  let h='<section>';
  h+='<div class="dh"><h2><span>'+d.index+'일차</span> '+d.date.slice(5).replace('-','/')+' '+esc(d.weekday)+'</h2>';
  h+='<p>'+esc(d.label)+'</p></div>';
  if(d.id==='d1') h+=esimHTML();
  h+='<ol class="tl">'+d.spots.map(s=>nodeHTML(d,s)).join('')+'</ol>';
  h+='</section>';
  return h;
}

/* ── eSIM 카드 ── */
function cpBtn(val){
  return '<button class="cp" type="button" data-act="copy" data-val="'+esc(val)+'">복사</button>';
}
function esimHTML(){
  const E=DATA.esim; if(!E) return '';
  let h='<div class="esim" id="esim-card">';
  h+='<div class="eh"><span class="ei">📱</span>'+esc(E.title)+'<span class="eb">발급 완료</span></div>';
  if(E.subtitle) h+='<p class="es">'+esc(E.subtitle)+'</p>';
  if(E.note) h+='<p class="es">'+esc(E.note)+'</p>';
  (E.people||[]).forEach((p,i)=>{
    h+='<details class="ep"'+(i===0?' open':'')+' data-ep="'+esc(p.id)+'">'+
      '<summary><span class="pn">'+esc(p.name)+'</span><span class="dev">'+esc(p.device)+'</span><span class="cv">›</span></summary>'+
      '<div class="epb">'+
      '<img class="eqr" src="'+esc(p.qr)+'" alt="'+esc(p.name+' eSIM QR')+'" loading="lazy">'+
      '<div class="kv2"><span class="k">SM-DP+</span><span class="v">'+esc(p.smdp)+'</span>'+cpBtn(p.smdp)+'</div>'+
      '<div class="kv2"><span class="k">활성화 코드</span><span class="v">'+esc(p.code)+'</span>'+cpBtn(p.code)+'</div>'+
      '<div class="kv2"><span class="k">ICCID</span><span class="v">'+esc(p.iccid)+'</span>'+cpBtn(p.iccid)+'</div>'+
      '</div></details>';
  });
  const G=E.guides||{};
  h+='<div class="egd">';
  ['android','ios'].forEach(k=>{
    const g=G[k]; if(!g) return;
    h+='<h5>'+esc(g.label)+'</h5><ol>'+g.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>';
  });

/* ── food tab ── */
const FCLS={'확정':'t-conf','후보':'t-cand','플랜B':'t-plan','동선 밖':'t-out'};
function foodCard(f){
  const parts=String(f.dish||'').split(' — ');
  const main=parts[0], sub=parts.slice(1).join(' — ');
  let h='<article class="fc">';
  h+='<h4 class="fd">'+esc(main)+(sub?'<span class="fsub"> — '+esc(sub)+'</span>':'')+'</h4>';
  h+='<div class="fm"><span class="fa">'+esc(f.area)+'</span>'+
     '<span class="ft '+(FCLS[f.tag]||'t-out')+'">'+esc(f.slot||f.tag)+'</span></div>';
  if(f.price) h+='<div class="fp">'+esc(f.price)+'</div>';
  if(f.note) h+='<div class="fn">'+esc(f.note)+'</div>';
  h+='<div class="ff"><span class="fnm">'+esc(f.name)+'</span>'+
     '<a class="fmap" href="'+esc(f.maps)+'">'+esc(f.mapLabel||'구글맵 ↗')+'</a></div>';
  h+='</article>';
  return h;
}
function foodHTML(){
  const cnt=t=>FOODS.filter(f=>f.tag===t).length;
  let h='<section class="page food">';
  h+='<div class="dh"><h2><span>맛집</span> '+FOODS.length+'곳</h2>'+
     '<p>뭘 먹는지 먼저 — 메뉴 카테고리를 눌러 펼쳐보세요</p></div>';
  h+='<div class="fsum"><span>✅ 확정 '+cnt('확정')+'</span><span>· 후보 '+cnt('후보')+'</span>'+
     '<span>· 대체안 '+cnt('플랜B')+'</span><span>· 동선 밖 '+cnt('동선 밖')+'</span></div>';
  h+=FOODGROUPS.map(g=>{
    const list=FOODS.filter(f=>f.g===g.id);
    if(!list.length) return '';
    return '<details class="fgrp"'+(state.fgroups.has(g.id)?' open':'')+' data-fg="'+esc(g.id)+'">'+
      '<summary><span class="ic">'+g.ico+'</span><span class="gt">'+esc(g.title)+'</span>'+
      '<span class="gn">'+list.length+'</span><span class="gv">⌄</span></summary>'+
      '<div class="fbody">'+list.map(foodCard).join('')+'</div></details>';
  }).join('');
  h+='<p class="note" style="margin:12px var(--pad) 0">가격·영업시간은 11/22 확인 기준입니다. '+
     '<b>구글맵 ↗</b>을 누르면 그 집 위치가 바로 열립니다.</p>';
  h+='</section>';
  return h;
}

/* ── decide tab ── (상단 탭에서는 숨김 — 복원하려면 tabsHTML에 버튼만 다시 추가) */
function decideHTML(){
  const decs=Object.values(DEC).filter(d=>!d.done);
  let h='<section class="page">';
  h+='<h3 class="ph">미정 항목 <em>'+decs.length+'</em></h3>';
  if(decs.length){
    h+='<ul class="list">'+decs.map(d=>{
      const day=byDay(d.dayId);
      return '<li class="row" data-act="jump" data-day="'+esc(d.dayId||'')+'" data-spot="'+esc(d.spotId||'')+'">'+
        '<span class="rd">'+(day?day.index+'일':'')+'</span>'+
        '<span class="rt"><b>'+esc(d.title)+'</b><i>'+esc(d.hint||'')+'</i></span><span class="ra">›</span></li>';
    }).join('')+'</ul>';
  } else {
    h+='<div class="empty">남은 미정 항목이 없어요</div>';
  }

  if((DATA.prep||[]).length){
    h+='<h3 class="ph">출발 전 <em>'+DATA.prep.length+'</em></h3>';
    h+='<ul class="chk">'+DATA.prep.map(p=>'<li><span class="w'+(p.urgent?' urgent':'')+'">'+esc(p.when)+'</span><span>'+esc(p.text)+'</span></li>').join('')+'</ul>';
  }
  if((DATA.bookings||[]).length){
    h+='<h3 class="ph">확정 예약 <em>'+DATA.bookings.length+'</em></h3>';
    h+='<ul class="bks">'+DATA.bookings.map(b=>'<li><span class="bi">'+(b.icon||'🎫')+'</span><span class="bt"><b>'+esc(b.label)+'</b>'+
      (b.ref?'<span class="rf">'+esc(b.ref)+'</span>':'')+
      (b.note?'<span>'+esc(b.note)+'</span>':'')+'</span></li>').join('')+'</ul>';
  }
  const b=DATA.budget;
  if(b){
    h+='<h3 class="ph">비용</h3>';
    h+='<details class="sec"><summary><span>현금 '+yen(b.cashNeededJPY)+' · 합계 '+yen(b.summaryJPY)+'</span></summary><div class="in">'+
      (b.items||[]).map(it=>'<div class="kv"><span>'+esc(it.item)+'</span><b>'+(it.amountJPY?yen(it.amountJPY):won(it.amountKRW))+'</b></div>').join('')+
      (b.cashNote?'<p class="note">'+esc(b.cashNote)+'</p>':'')+'</div></details>';
  }
  if((DATA.changeLog||[]).length){
    h+='<details class="sec"><summary><span>바뀐 내용 '+DATA.changeLog.length+'</span></summary><div class="in">'+
      DATA.changeLog.map(c=>'<div class="kv"><span class="lft">'+esc(c.date.slice(5).replace('-','/'))+'</span><b class="lft" style="text-align:right">'+esc(c.text)+'</b></div>').join('')+
      '</div></details>';
  }
  h+='</section>';
  return h;
}

/* ── render ── */
function render(){
  $('#tabs').innerHTML=tabsHTML();
  $('#main').innerHTML=(state.tab==='food'? foodHTML() : dayHTML(byDay(state.tab)));
  document.querySelectorAll('details.cmp').forEach(d=>{ if(d.open) state.openDecs.add(d); });
}
function setTab(t){
  state.tab=t; render();
  window.scrollTo(0,0);
}

/* ── sheet ── */
function openSheet(html){
  $('#sheetBody').innerHTML=html;
  const w=$('#sheetWrap'); w.classList.add('on'); w.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  w.querySelector('.sheet').scrollTop=0;
}
function closeSheet(){
  const w=$('#sheetWrap'); w.classList.remove('on'); w.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
function bookingHTML(s){
  const b=s.booking; if(!b) return '';
  const rows=[];
  if(b.party) rows.push(b.party+'인');
  if(b.channel) rows.push(b.channel);
  if(b.partyNote) rows.push(b.partyNote);
  return '<div class="bkbox"><div class="bk-h">'+(b.status==='walk_in'?'예약 불가 · 현장 대기':'예약 확정')+'</div>'+
    (b.ref?'<div class="bk-r">'+esc(b.ref)+'</div>':'')+
    (rows.length?'<div class="bk-n">'+rows.map(esc).join(' · ')+'</div>':'')+
    (b.price?'<div class="bk-n">'+esc(b.price)+'</div>':'')+
    (b.cancel?'<div class="bk-n">'+esc(b.cancel)+'</div>':'')+
    (b.link?'<div class="bk-n"><a href="'+esc(b.link)+'" style="color:#2340c8;font-weight:700;text-decoration:none">예약 확인 ›</a></div>':'')+
  '</div>';
}
function openSpot(id){
  const f=findSpot(id); if(!f) return;
  const {day,spot}=f;
  const facts=[];
  if(spot.address||spot.addressJa) facts.push(['주소', esc(spot.addressJa||'')+(spot.addressJa&&spot.address?' · ':'')+esc(spot.address||'')]);
  if(spot.hours) facts.push(['영업', esc(spot.hours)]);
  if(spot.phone) facts.push(['전화','<a href="tel:'+esc(String(spot.phone).replace(/\s/g,''))+'">'+esc(spot.phone)+'</a>']);
  if(spot.cost) facts.push(['비용',(spot.cost.currency==='JPY'?yen(spot.cost.amount):won(spot.cost.amount))+(spot.cost.basis?' · '+esc(spot.cost.basis):'')]);
  if(spot.timeStart) facts.push(['시간', esc(spot.timeStart)+'–'+esc(spot.timeEnd||'')+(durText(durMin(spot.timeStart,spot.timeEnd))?' · '+durText(durMin(spot.timeStart,spot.timeEnd)):'')]);
  if(spot.leg) facts.push(['이동', esc(legText(spot.leg))+(spot.leg.detail?' · '+esc(spot.leg.detail):'')]);
  const ws=warnFor(spot.id);
  const dec=spot.dec&&DEC[spot.dec];

  let h='<div class="sh-head"><div style="flex:1;min-width:0">'+
    '<div class="st">'+day.index+'일차 · '+esc(day.date.slice(5).replace('-','/'))+' '+esc(day.weekday)+' · '+esc(spot.timeStart||'')+'</div>'+
    '<h3>'+esc(spot.name)+'</h3>'+(spot.nameJa?'<div class="ja">'+esc(spot.nameJa)+'</div>':'')+'</div>'+
    '<button class="x2" data-act="close" aria-label="닫기">✕</button></div>';
  if(spot.status && spot.status!=='confirmed') h+='<div style="margin-top:7px">'+badgeHTML(spot.status)+'</div>';
  h+=bookingHTML(spot);
  if(facts.length) h+='<dl class="facts">'+facts.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')+'</dl>';
  if(ws.length) h+=ws.map(w=>'<div class="warn"><span>⚠️</span><span>'+esc(w.text)+'</span></div>').join('');
  if(spot.note) h+='<p class="cnote">'+esc(spot.note)+'</p>';
  if(spot.notes&&spot.notes.length) h+='<ul class="cnotes">'+spot.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  h+='<div class="sacts">'+
      '<a href="'+esc(mapsOf(spot))+'">구글 지도 위치</a>'+
      (spot.booking&&spot.booking.link?'<a href="'+esc(spot.booking.link)+'">예약 확인</a>':'')+
    '</div>';
  if(dec) h+=decFold(dec,false);
  openSheet(h);
}

/* ── actions ── */
function goSpot(dayId, spotId){
  setTab(dayId);
  if(!spotId) return;
  setTimeout(()=>{
    const el=document.getElementById('n-'+spotId); if(!el) return;
    el.scrollIntoView({behavior:'smooth', block:'center'});
    const det=el.querySelector('details.cmp');
    if(det) det.open=true;
    const card=el.querySelector('.card');
    if(card){ card.style.borderColor='#b9c6f0'; setTimeout(()=>{card.style.borderColor='';}, 1600); }
  }, 70);
}
/* 메뉴 카테고리 펼침 상태 유지 */
document.addEventListener('click', e=>{
  const s=e.target.closest('summary');
  if(!s) return;
  const d=s.parentElement;
  if(!d || !d.hasAttribute('data-fg')) return;
  if(d.open) state.fgroups.delete(d.dataset.fg); else state.fgroups.add(d.dataset.fg);
}, true);

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(el){
    const act=el.dataset.act;
    if(act==='tab'){ setTab(el.dataset.tab); return; }
    if(act==='large'){ state.large=!state.large; applyLarge(); storePrefs(); return; }
    if(act==='open'){ if(e.target.closest('details.cmp')) return; openSpot(el.dataset.spot); return; }
    if(act==='close'){ closeSheet(); return; }
    if(act==='copy'){ copyText(el.dataset.val, el); return; }
    if(act==='jump'){ closeSheet(); goSpot(el.dataset.day, el.dataset.spot); return; }
    return;
  }
  if(e.target.closest('.backdrop')) closeSheet();
});

function storePrefs(){ try{ localStorage.setItem('tkv2:large', state.large?'1':'0'); }catch(e){} }
function loadPrefs(){ try{ state.large = localStorage.getItem('tkv2:large')==='1'; }catch(e){ state.large=false; } }

/* ── init / boot ── */
function init(){
  DATA=payloadData;
  DAYS=DATA.days||[]; DEC=DATA.decisions||{}; WARN=DATA.warnings||[];
  FOODS=DATA.foods||[]; FOODGROUPS=DATA.foodGroups||[];
  if(FOODGROUPS.length){ state.fgroups=new Set([FOODGROUPS[0].id]); }
  const m=DATA.meta||{};
  $('#hTitle').textContent=m.title||'여행 일정';
  $('#hSub').textContent=(m.subtitle||'').replace(/·/g,' · ');
  if(m.title) document.title=m.title;
  $('#foot').innerHTML=(m.dataFrozenAt?'기준 '+esc(m.dataFrozenAt)+' · ':'')+'가족 공유용';
  loadPrefs(); applyLarge();
  state.tab=DAYS.length?DAYS[0].id:'d1';
  render();
}

(async function boot(){
  if(!PAYLOAD){ lockMsg('데이터를 불러오지 못했습니다.'); return; }
  let raw=null;
  try{ raw=sessionStorage.getItem('tkv2'); }catch(e){}
  if(raw){
    try{
      const dk=b64d(raw);
      if(dk.length===64){
        const data=decryptWith({enc:dk.subarray(0,32), mac:dk.subarray(32,64)});
        if(data){ reveal(data); return; }
      }
    }catch(e){}
    try{ sessionStorage.removeItem('tkv2'); }catch(e){}
  }
  dots();
})();
</script>
</body>
</html>
